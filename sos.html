<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOS Autoroute - طلب المساعدة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background: #e2e8f0;
        }

        #map {
            height: 100dvh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* شريط علوي خفيف ومتجاوب للهواتف */
        .mobile-topbar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.96);
            padding: 8px 14px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 800;
            color: #1a365d;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-switch-btn {
            background: #edf2f7;
            color: #1a202c;
            border: 1px solid #cbd5e0;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        /* بطاقة سفلية خفيفة ومريحة ليد السائق */
        .bottom-sos-card {
            position: absolute;
            bottom: 18px;
            left: 12px;
            right: 12px;
            max-width: 480px;
            margin: 0 auto;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.98);
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.22);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-msg {
            font-size: 13px;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            background: #f7fafc;
            color: #2d3748;
            font-weight: 600;
            line-height: 1.4;
        }

        .status-msg.warning { background: #fffaf0; color: #c05621; border: 1px solid #fbd38d; }
        .status-msg.success { background: #f0fff4; color: #22543d; border: 1px solid #9ae6b4; }
        .status-msg.error   { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }

        .pk-result-box {
            display: none;
            background: #1a365d;
            color: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            direction: ltr;
        }

        .pk-result-box .pk-big {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #fbd38d;
        }

        .pk-result-box .gps-small {
            font-size: 11px;
            color: #cbd5e0;
            margin-top: 2px;
        }

        .main-gps-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #2b6cb0;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(43, 108, 176, 0.3);
            transition: 0.2s;
        }

        .main-gps-btn:active { transform: scale(0.98); }
        .main-gps-btn.tracking { background: #718096; box-shadow: none; }

        .sos-actions-row {
            display: none;
            gap: 8px;
        }

        .sos-link-btn {
            flex: 1;
            padding: 13px 8px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-sms { background: #dd6b20; }
        .btn-wa  { background: #25d366; }

        .leaflet-top { top: 62px !important; }
    </style>
</head>
<body>

    <!-- الشريط العلوي الخفيف -->
    <div class="mobile-topbar">
        <div class="brand-title">
            <span>🛣️</span>
            <span id="ui-title">نجدة الطريق السيار</span>
        </div>
        <button id="lang-btn" class="lang-switch-btn" onclick="toggleLang()">FR</button>
    </div>

    <!-- الخريطة -->
    <div id="map"></div>

    <!-- بطاقة التحكم السفلية للهاتف -->
    <div class="bottom-sos-card">
        <div id="status-box" class="status-msg">اضغط على الزر لتحديد موقعك على الطريق السيار</div>

        <div id="pk-box" class="pk-result-box">
            <div id="pk-text" class="pk-big">PK 000+000</div>
            <div id="gps-text" class="gps-small">00.000000, -00.000000</div>
        </div>

        <div id="sos-buttons" class="sos-actions-row">
            <a id="sms-link" href="#" class="sos-link-btn btn-sms">📩 <span id="ui-sms">رسالة SMS</span></a>
            <a id="wa-link" href="#" target="_blank" class="sos-link-btn btn-wa">💬 <span id="ui-wa">واتساب</span></a>
        </div>

        <button id="gps-action-btn" class="main-gps-btn" onclick="toggleTracking()">
            📍 <span id="ui-gps-btn">تحديد موقعي وطلب المساعدة</span>
        </button>
    </div>

    <!-- تحميل ملف المسارات المشترك -->
    <script src="routes.js"></script>
    <script>
        // 1. إعدادات أرقام مراكز المراقبة حسب المقاطع
        const DISPATCH_ZONES = [
            { minPK: 34.000,  maxPK: 242.200, phone: "212618160586" },
            { minPK: 242.201, maxPK: 450.000, phone: "212662053193" }
        ];
        const DEFAULT_PHONE = "212618160586";

        // 2. قاموس اللغتين (عربي / فرنسي)
        let lang = 'ar';
        const i18n = {
            ar: {
                title: "نجدة الطريق السيار",
                langBtn: "FR",
                idleMsg: "اضغط على الزر لتحديد موقعك على الطريق السيار",
                searching: "⏳ جاري تحديد موقعك بدقة عبر GPS...",
                gpsBtnStart: "تحديد موقعي وطلب المساعدة",
                gpsBtnStop: "✖ إيقاف التحديد",
                movingWarn: "⚠️ أنت تتحرك بسرعة! يرجى التوقف بأمان على شريط الوقوف الاضطراري لطلب المساعدة.",
                outsideWarn: "⚠️ يبدو أنك خارج مسار الطريق السيار (أكثر من 200 متر).",
                weakSignal: "⏳ إشارة GPS ضعيفة، يرجى الانتظار في مكان مفتوح...",
                readyOk: "✅ تم التحقق من توقفك على الطريق السيار. اختر وسيلة الإرسال:",
                smsText: "رسالة SMS",
                waText: "واتساب"
            },
            fr: {
                title: "SOS Autoroute",
                langBtn: "AR",
                idleMsg: "Appuyez sur le bouton pour localiser votre position",
                searching: "⏳ Recherche de votre position GPS...",
                gpsBtnStart: "Me localiser / Demander aide",
                gpsBtnStop: "✖ Arrêter",
                movingWarn: "⚠️ Véhicule en mouvement ! Arrêtez-vous sur la bande d'arrêt d'urgence.",
                outsideWarn: "⚠️ Vous êtes hors du tracé de l'autoroute (> 200m).",
                weakSignal: "⏳ Signal GPS faible, patientez à ciel ouvert...",
                readyOk: "✅ Position confirmée à l'arrêt. Envoyez votre position :",
                smsText: "Envoyer SMS",
                waText: "WhatsApp"
            }
        };

        function toggleLang() {
            lang = (lang === 'ar') ? 'fr' : 'ar';
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;

            const t = i18n[lang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('lang-btn').innerText = t.langBtn;
            document.getElementById('ui-sms').innerText = t.smsText;
            document.getElementById('ui-wa').innerText = t.waText;
            document.getElementById('ui-gps-btn').innerText = watchId ? t.gpsBtnStop : t.gpsBtnStart;
            if (!watchId) setStatus(t.idleMsg, '');
        }

        function setStatus(text, type) {
            const box = document.getElementById('status-box');
            box.innerText = text;
            box.className = 'status-msg ' + (type || '');
        }

        // 3. تحميل مكتبات الخرائط الخفيفة
        (function initLibraries() {
            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'https:/' + '/cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
            document.head.appendChild(css);

            const s1 = document.createElement('script');
            s1.src = 'https:/' + '/cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
            s1.onload = function() {
                const s2 = document.createElement('script');
                s2.src = 'https:/' + '/cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js';
                s2.onload = buildMobileMap;
                document.body.appendChild(s2);
            };
            document.body.appendChild(s1);
        })();

        let map, userMarker, watchId = null, lastPos = null;
        let loadedLines = {};

        function buildMobileMap() {
            map = L.map('map', { zoomControl: false }).setView([31.83, -8.06], 11);
            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OSM'
            }).addTo(map);

let bounds = L.latLngBounds([]);
allRoutes.forEach(function(route) {
const line = turf.lineString(route.coords);
const fName = route.forwardDir ? (route.name + ' - ' + route.forwardDir) : route.name;
loadedLines[route.id] = { line: line, info: { ...route, name: fName } };
const latLngs = route.coords.map(pt => [pt.at(1), pt.at(0)]);
const poly = L.polyline(latLngs, { color: route.color, weight: 4 }).addTo(map);
bounds.extend(poly.getBounds());
if (route.hasReverse) {
const offset = turf.lineOffset(line, 0.02, { units: 'kilometers' });
const revCoords = [...offset.geometry.coordinates].reverse();
const revLine = turf.lineString(revCoords);
const rName = route.reverseDir ? (route.name + ' - ' + route.reverseDir) : (route.name + ' (Retour)');
loadedLines[route.id + '_rev'] = { line: revLine, info: { ...route, name: rName, isReverse: true } };
const revLatLngs = revCoords.map(pt => [pt.at(1), pt.at(0)]);
L.polyline(revLatLngs, { color: route.reverseColor || '#e53e3e', weight: 4 }).addTo(map);
}
});
if (bounds.isValid()) map.fitBounds(bounds);
}
function getDispatchPhone(lat, lon, routeId) {
let refPK = null;
const sel = loadedLines[routeId];
if (sel && sel.info.name.startsWith('A3')) {
const snap = turf.nearestPointOnLine(sel.line, turf.point([lon, lat]), { units: 'kilometers' });
const len = turf.length(sel.line, { units: 'kilometers' });
refPK = sel.info.isReverse ? (sel.info.startPK + len - snap.properties.location) : (sel.info.startPK + snap.properties.location);
} else {
Object.values(loadedLines).filter(r => r.info.name.startsWith('A3') && !r.info.isReverse).forEach(sec => {
const snap = turf.nearestPointOnLine(sec.line, turf.point([lon, lat]), { units: 'kilometers' });
if (refPK === null) refPK = sec.info.startPK + snap.properties.location;
});
}
if (refPK !== null) {
for (let z of DISPATCH_ZONES) {
if (refPK >= z.minPK && refPK <= z.maxPK) return z.phone;
}
}
return DEFAULT_PHONE;
}
function toggleTracking() {
const btn = document.getElementById('gps-action-btn');
const t = i18n[lang];
if (watchId !== null) {
navigator.geolocation.clearWatch(watchId);
watchId = null;
lastPos = null;
btn.classList.remove('tracking');
document.getElementById('ui-gps-btn').innerText = t.gpsBtnStart;
document.getElementById('pk-box').style.display = 'none';
document.getElementById('sos-buttons').style.display = 'none';
if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
setStatus(t.idleMsg, '');
return;
}
if (!navigator.geolocation) return alert("GPS non disponible");
btn.classList.add('tracking');
document.getElementById('ui-gps-btn').innerText = t.gpsBtnStop;
setStatus(t.searching, '');
watchId = navigator.geolocation.watchPosition(function(pos) {
const lat = pos.coords.latitude;
const lon = pos.coords.longitude;
const acc = pos.coords.accuracy;
let speedKmh = 0;
if (pos.coords.speed !== null && pos.coords.speed >= 0) {
speedKmh = pos.coords.speed * 3.6;
} else if (lastPos) {
const d = turf.distance(turf.point([lastPos.lon, lastPos.lat]), turf.point([lon, lat]), { units: 'kilometers' });
const h = (pos.timestamp - lastPos.timestamp) / 3600000;
if (h > 0) speedKmh = d / h;
}
lastPos = { lat: lat, lon: lon, timestamp: pos.timestamp };
map.setView([lat, lon], 16);
if (!userMarker) userMarker = L.marker([lat, lon]).addTo(map);
else userMarker.setLatLng([lat, lon]);
// البحث عن أقرب مسار
let closestId = null, minDistKm = Infinity, bestSnap = null;
const pt = turf.point([lon, lat]);
Object.keys(loadedLines).forEach(id => {
const snap = turf.nearestPointOnLine(loadedLines[id].line, pt, { units: 'kilometers' });
if (snap.properties.dist < minDistKm) {
minDistKm = snap.properties.dist;
closestId = id;
bestSnap = snap;
}
});
const distMeters = minDistKm * 1000;
const sosDiv = document.getElementById('sos-buttons');
const pkBox = document.getElementById('pk-box');
// التحقق من الشروط الثلاثة
if (acc > 100) {
sosDiv.style.display = 'none';
setStatus(t.weakSignal, 'warning');
return;
}
if (distMeters > 200 || !closestId) {
sosDiv.style.display = 'none';
pkBox.style.display = 'none';
setStatus(t.outsideWarn, 'error');
return;
}
// حساب الـ PK الدقيق وعرضه
const sel = loadedLines[closestId];
const len = turf.length(sel.line, { units: 'kilometers' });
const exactPK = sel.info.isReverse
? (sel.info.startPK + len - bestSnap.properties.location)
: (sel.info.startPK + bestSnap.properties.location);
const km = Math.floor(exactPK);
const m = String(Math.round((exactPK - km) * 1000)).padStart(3, '0');
const pkLabel = 'PK ' + km + '+' + m + ' (' + sel.info.name + ')';
document.getElementById('pk-text').innerText = pkLabel;
document.getElementById('gps-text').innerText = lat.toFixed(6) + ', ' + lon.toFixed(6);
pkBox.style.display = 'block';
if (speedKmh > 5) {
sosDiv.style.display = 'none';
setStatus(t.movingWarn, 'warning');
return;
}
// جميع الشروط متحققة (واقف + داخل 200م + إشارة جيدة) -> إظهار أزرار الإرسال
const targetPhone = getDispatchPhone(lat, lon, closestId);
const mapsUrl = 'https:/' + '/google.com' + lat.toFixed(6) + ',' + lon.toFixed(6);
const msg = "🚨 SOS Autoroute:\n• Position: " + pkLabel + "\n• GPS: " + lat.toFixed(6) + ", " + lon.toFixed(6) + "\n• Carte: " + mapsUrl;
const encoded = encodeURIComponent(msg);
document.getElementById('sms-link').href = "sms:+" + targetPhone + "?body=" + encoded;
document.getElementById('wa-link').href = "https:/" + "/wa.me/" + targetPhone + "?text=" + encoded;
sosDiv.style.display = 'flex';
setStatus(t.readyOk, 'success');
}, function() {
setStatus("⚠️ GPS Error", 'error');
}, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
}
// تفعيل العمل بدون إنترنت
if ('serviceWorker' in navigator) {
window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
